name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_filename: ${{ steps.pack.outputs.artifact_filename }}
      artifact_integrity: ${{ steps.pack.outputs.artifact_integrity }}
      commit: ${{ steps.release.outputs.commit }}
      package_exists: ${{ steps.registry.outputs.package_exists }}
      registry_status: ${{ steps.registry.outputs.registry_status }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate trigger
        id: trigger
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          RUN_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RUN_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub run commit is not a full commit SHA." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$EVENT_REF" != "refs/heads/main" ]] \
              && [[ ! "$EVENT_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Manual releases must be dispatched from main or a strict version tag." >&2
              exit 1
            fi
            release_tag="$DISPATCH_TAG"
          elif [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == refs/tags/* ]]; then
            release_tag="${EVENT_REF#refs/tags/}"
          else
            echo "Unsupported release trigger." >&2
            exit 1
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use strict vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check out the GitHub run commit with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve immutable release
        id: release
        env:
          EXPECTED_PACKAGE_NAME: "@silmaril-security/firewall-plugin"
          EXPECTED_REPOSITORY_TYPE: git
          EXPECTED_REPOSITORY_URL: "git+https://github.com/Silmaril-Security/FirewallPlugin.git"
          RELEASE_TAG: ${{ steps.trigger.outputs.tag }}
          RUN_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Release tag does not exist: ${RELEASE_TAG}" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$tag_commit" != "$RUN_COMMIT" ]]; then
            echo "GitHub run commit does not match the selected release tag commit." >&2
            echo "Dispatch this workflow from the tag: gh workflow run release.yml --ref ${RELEASE_TAG} -f tag=${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RUN_COMMIT" ]]; then
            echo "Checked-out commit does not match the GitHub run commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Release tag commit is not an ancestor of origin/main." >&2
            exit 1
          fi

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_private="$(node -p "String(require('./package.json').private === true)")"
          repository_type="$(node -p "require('./package.json').repository?.type ?? ''")"
          repository_url="$(node -p "require('./package.json').repository?.url ?? ''")"

          if [[ "$package_name" != "$EXPECTED_PACKAGE_NAME" ]]; then
            echo "Unexpected package name: ${package_name}" >&2
            exit 1
          fi
          if [[ "$repository_type" != "$EXPECTED_REPOSITORY_TYPE" ]] \
            || [[ "$repository_url" != "$EXPECTED_REPOSITORY_URL" ]]; then
            echo "Package repository metadata does not match the canonical repository." >&2
            exit 1
          fi
          if [[ "$package_private" == "true" ]]; then
            echo "Refusing to publish a private package." >&2
            exit 1
          fi
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must use strict MAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Release tag does not match package version." >&2
            exit 1
          fi

          {
            printf 'commit=%s\n' "$RUN_COMMIT"
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$package_version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install npm 11.21.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.21.0
          [[ "$(npm --version)" == "11.21.0" ]]

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build release artifact
        id: pack
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="${RUNNER_TEMP}/release-artifact"
          pack_json="${RUNNER_TEMP}/npm-pack.json"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          npm pack --json --pack-destination "$artifact_dir" > "$pack_json"

          shopt -s nullglob
          tarballs=("$artifact_dir"/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one packed tarball." >&2
            exit 1
          fi

          artifact_path="${tarballs[0]}"
          artifact_filename="$(basename "$artifact_path")"
          expected_filename="silmaril-security-firewall-plugin-${RELEASE_VERSION}.tgz"
          if [[ "$artifact_filename" != "$expected_filename" ]] \
            || [[ ! "$artifact_filename" =~ ^silmaril-security-firewall-plugin-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]; then
            echo "Packed artifact filename is not the validated package/version filename." >&2
            exit 1
          fi

          artifact_integrity="$(
            node --input-type=module - "$artifact_path" <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";

          const bytes = fs.readFileSync(process.argv[2]);
          process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          )"

          PACK_JSON_PATH="$pack_json" \
          ARTIFACT_FILENAME="$artifact_filename" \
          ARTIFACT_INTEGRITY="$artifact_integrity" \
            node --input-type=module <<'NODE'
          import fs from "node:fs";

          const packed = JSON.parse(fs.readFileSync(process.env.PACK_JSON_PATH, "utf8"));
          if (!Array.isArray(packed) || packed.length !== 1) {
            throw new Error("npm pack JSON did not describe exactly one artifact");
          }
          if (packed[0].filename !== process.env.ARTIFACT_FILENAME) {
            throw new Error("npm pack JSON filename does not match the produced artifact");
          }
          if (packed[0].integrity !== process.env.ARTIFACT_INTEGRITY) {
            throw new Error("npm pack JSON integrity does not match the produced artifact bytes");
          }
          NODE

          {
            printf 'artifact_filename=%s\n' "$artifact_filename"
            printf 'artifact_integrity=%s\n' "$artifact_integrity"
          } >> "$GITHUB_OUTPUT"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/release-artifact/${{ steps.pack.outputs.artifact_filename }}
          if-no-files-found: error
          retention-days: 1

      - name: Check public registry
        id: registry
        env:
          ARTIFACT_INTEGRITY: ${{ steps.pack.outputs.artifact_integrity }}
          EXPECTED_PACKAGE_NAME: "@silmaril-security/firewall-plugin"
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const name = process.env.EXPECTED_PACKAGE_NAME;
          const version = process.env.RELEASE_VERSION;
          const integrity = process.env.ARTIFACT_INTEGRITY;
          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(url, {
            headers: { accept: "application/json" },
          });

          if (response.status === 404) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "package_exists=false\nregistry_status=absent\n");
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `npm registry status: ${name}@${version} is absent and eligible for trusted publishing.\n`,
            );
            console.log(`npm registry status: ${name}@${version} is absent.`);
            process.exit(0);
          }

          if (!response.ok) {
            throw new Error(`npm registry returned HTTP ${response.status}; refusing to publish`);
          }

          const metadata = await response.json();
          if (metadata.name !== name || metadata.version !== version) {
            throw new Error("npm registry returned mismatched package metadata");
          }
          if (metadata.dist?.integrity !== integrity) {
            throw new Error(
              "Existing npm version has different tarball integrity; coordinator inspection is required",
            );
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            "package_exists=true\nregistry_status=existing_identical_artifact\n",
          );
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `npm registry status: ${name}@${version} already has the identical ${integrity} artifact; publish skipped.\n`,
          );
          console.log(`npm registry status: ${name}@${version} already has the identical artifact.`);
          NODE

  publish:
    name: Publish to npm
    needs: validation
    if: needs.validation.outputs.package_exists == 'false'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out validated release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validation.outputs.commit }}

      - name: Verify validated release identity
        env:
          EXPECTED_PACKAGE_NAME: "@silmaril-security/firewall-plugin"
          EXPECTED_REPOSITORY_TYPE: git
          EXPECTED_REPOSITORY_URL: "git+https://github.com/Silmaril-Security/FirewallPlugin.git"
          RELEASE_COMMIT: ${{ needs.validation.outputs.commit }}
          RELEASE_TAG: ${{ needs.validation.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validation.outputs.version }}
          RUN_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RUN_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "Publish job GitHub run commit does not match the validated release commit." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]]; then
            echo "Publish checkout does not match the validated commit." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Validated release tag is missing." >&2
            exit 1
          fi
          if [[ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" != "$RELEASE_COMMIT" ]]; then
            echo "Validated release tag no longer resolves to the validated commit." >&2
            exit 1
          fi

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_private="$(node -p "String(require('./package.json').private === true)")"
          repository_type="$(node -p "require('./package.json').repository?.type ?? ''")"
          repository_url="$(node -p "require('./package.json').repository?.url ?? ''")"
          if [[ "$package_name" != "$EXPECTED_PACKAGE_NAME" ]] \
            || [[ "$package_version" != "$RELEASE_VERSION" ]] \
            || [[ "$RELEASE_TAG" != "v${package_version}" ]] \
            || [[ "$package_private" == "true" ]] \
            || [[ "$repository_type" != "$EXPECTED_REPOSITORY_TYPE" ]] \
            || [[ "$repository_url" != "$EXPECTED_REPOSITORY_URL" ]]; then
            echo "Package metadata no longer matches the validated release." >&2
            exit 1
          fi

      - name: Download validated release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/release-artifact

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install npm 11.21.0
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.21.0
          [[ "$(npm --version)" == "11.21.0" ]]

      - name: Verify downloaded release artifact
        env:
          ARTIFACT_FILENAME: ${{ needs.validation.outputs.artifact_filename }}
          ARTIFACT_INTEGRITY: ${{ needs.validation.outputs.artifact_integrity }}
          ARTIFACT_ROOT: ${{ runner.temp }}/release-artifact
          EXPECTED_PACKAGE_NAME: "@silmaril-security/firewall-plugin"
          EXPECTED_REPOSITORY_TYPE: git
          EXPECTED_REPOSITORY_URL: "git+https://github.com/Silmaril-Security/FirewallPlugin.git"
          RELEASE_TAG: ${{ needs.validation.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validation.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          expected_filename="silmaril-security-firewall-plugin-${RELEASE_VERSION}.tgz"
          if [[ "$ARTIFACT_FILENAME" != "$expected_filename" ]] \
            || [[ ! "$ARTIFACT_FILENAME" =~ ^silmaril-security-firewall-plugin-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]; then
            echo "Artifact filename is not safe or does not match the validated version." >&2
            exit 1
          fi

          shopt -s nullglob
          tarballs=("$ARTIFACT_ROOT"/*.tgz)
          if [[ "${#tarballs[@]}" -ne 1 ]] \
            || [[ "$(basename "${tarballs[0]}")" != "$ARTIFACT_FILENAME" ]]; then
            echo "Downloaded artifact set does not contain exactly the validated tarball." >&2
            exit 1
          fi
          artifact_path="${tarballs[0]}"
          actual_integrity="$(
            node --input-type=module - "$artifact_path" <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";

          const bytes = fs.readFileSync(process.argv[2]);
          process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          )"
          if [[ "$actual_integrity" != "$ARTIFACT_INTEGRITY" ]]; then
            echo "Downloaded artifact integrity does not match validation output." >&2
            exit 1
          fi

          tar -xOf "$artifact_path" package/package.json > "${RUNNER_TEMP}/artifact-package.json"
          PACKAGE_JSON_PATH="${RUNNER_TEMP}/artifact-package.json" \
          EXPECTED_PACKAGE_NAME="$EXPECTED_PACKAGE_NAME" \
          EXPECTED_REPOSITORY_TYPE="$EXPECTED_REPOSITORY_TYPE" \
          EXPECTED_REPOSITORY_URL="$EXPECTED_REPOSITORY_URL" \
          RELEASE_TAG="$RELEASE_TAG" \
          RELEASE_VERSION="$RELEASE_VERSION" \
            node --input-type=module <<'NODE'
          import fs from "node:fs";

          const manifest = JSON.parse(fs.readFileSync(process.env.PACKAGE_JSON_PATH, "utf8"));
          if (
            manifest.name !== process.env.EXPECTED_PACKAGE_NAME
            || manifest.version !== process.env.RELEASE_VERSION
            || process.env.RELEASE_TAG !== `v${manifest.version}`
            || manifest.private === true
            || manifest.repository?.type !== process.env.EXPECTED_REPOSITORY_TYPE
            || manifest.repository?.url !== process.env.EXPECTED_REPOSITORY_URL
          ) {
            throw new Error("Packed manifest does not match the validated release identity");
          }
          NODE

      - name: Publish with trusted provenance
        env:
          ARTIFACT_FILENAME: ${{ needs.validation.outputs.artifact_filename }}
          ARTIFACT_ROOT: ${{ runner.temp }}/release-artifact
        shell: bash
        run: |
          set -euo pipefail
          npm publish "${ARTIFACT_ROOT}/${ARTIFACT_FILENAME}" --access public --provenance --ignore-scripts
